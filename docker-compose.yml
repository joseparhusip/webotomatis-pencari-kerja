services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
      POSTGRES_DB: jobs
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"  # 5433 dipakai MedCredix
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://jobs:jobs@postgres:5432/jobs
      REDIS_URL: redis://redis:6379
      WATCHFILES_FORCE_POLLING: "true"  # bind mount Windows tidak meneruskan event perubahan file
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app --reload-include '*.html' --reload-include '*.css'"
    ports:
      - "8030:8000"  # http://localhost:8030
    volumes:
      - ./backend:/code
      - ./storage:/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://jobs:jobs@postgres:5432/jobs
      REDIS_URL: redis://redis:6379
    command: arq app.workers.main.WorkerSettings
    volumes:
      - ./backend:/code
      - ./storage:/storage
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      web: { condition: service_started }

volumes:
  pgdata:
